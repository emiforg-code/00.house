<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Tenant dashboard | 00.house</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --black:#0a0a0a; --muted:#6b6b6b; --white:#fff; --line:rgba(0,0,0,0.08);
  --trust-blue-deep:#0F3D5C; --trust-blue-tint:#DCEBF3; --brass:#b98a3f;
}
*{box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;margin:0;background:#ffffff;color:var(--black)}
h1,h2{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700;margin:0}
p{color:var(--muted);line-height:1.5;margin:4px 0 0}
nav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 20px;background:var(--trust-blue-deep);color:#fff}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;color:#fff;text-decoration:none;font-size:15px}
.nav-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav-right a,.nav-right span{color:#fff;font-size:12.5px;text-decoration:none;margin-left:14px;opacity:0.9;cursor:pointer}
main{max-width:960px;margin:0 auto;padding:24px 16px 70px}
@media (max-width:480px){
  nav{padding:12px 14px}
  .logo{font-size:14px}
  main{padding:18px 14px 60px}
  .fav-card{flex-direction:column;align-items:flex-start;gap:10px}
  .fav-card button{align-self:flex-end}
}
.loading-note{background:#f5f5f7;border:1px solid var(--line);color:#444;padding:10px 14px;border-radius:8px;font-size:12.5px;margin-bottom:24px}

/* ---- Stat cards ---- */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0 26px}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 14px;text-align:center}
.stat-card .num{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700;font-size:26px;color:var(--trust-blue-deep);line-height:1}
.stat-card .lbl{font-size:10.5px;letter-spacing:0.04em;text-transform:uppercase;color:var(--muted);margin-top:5px}

.grid{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start}
@media (max-width:760px){ .grid{grid-template-columns:1fr} }
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px}
.contact-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.contact-row:last-child{border-bottom:0}
.contact-row .k{color:var(--muted)}
.contact-row .v{font-weight:600;text-align:right}

section.block{margin-bottom:30px}
section.block h2{font-size:17px;margin-bottom:12px}

.fav-list,.viewings-list{display:flex;flex-direction:column;gap:12px}
.fav-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.fav-icon{flex:0 0 40px;width:40px;height:40px;border-radius:8px;background:var(--trust-blue-tint);display:flex;align-items:center;justify-content:center;color:var(--trust-blue-deep)}
.fav-main{flex:1;min-width:0}
.fav-card .addr{font-weight:600;font-size:14px}
.fav-card .rent{font-size:12.5px;color:var(--muted);margin-top:2px}
.fav-card button{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12px;color:var(--muted);cursor:pointer;flex:0 0 auto}
.fav-card button:hover{border-color:#c0392b;color:#c0392b}

.viewing-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.viewing-card .addr{font-weight:600;font-size:14px}
.viewing-card .when{font-size:12.5px;color:var(--brass);margin-top:3px}
.rainbow-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.rainbow-bar{position:relative;flex:1;height:8px;border-radius:999px;background:linear-gradient(90deg,#d9453d 0%,#e0a62e 35%,#4caf6b 65%,#2f6b4f 100%);max-width:220px}
.rainbow-bar.unknown{background:#e2e2e2}
.rainbow-marker{position:absolute;top:-3px;width:3px;height:14px;background:#111;border-radius:2px;transform:translateX(-50%)}
.rainbow-lbl{font-size:11px;color:var(--muted)}

.empty-card{background:#fff;border:1px dashed var(--line);border-radius:10px;padding:24px;text-align:center;color:var(--muted);font-size:13.5px}
</style>
</head>
<body>
<nav>
  <a class="logo" href="index.html">00.house <span style="opacity:.7;font-weight:400">· Tenant</span></a>
  <div class="nav-right">
    <span id="tenantNameLabel"></span>
    <a id="signOutLink">Sign out</a>
  </div>
</nav>

<main>
  <h1>Your account</h1>
  <p>Your contact details, saved homes, and the viewings you've requested.</p>

  <div class="loading-note" id="loadingNote">Loading your account…</div>

  <div id="statsGrid" class="stats-grid" style="display:none"></div>

  <div id="contentGrid" class="grid" style="display:none">
    <div class="card">
      <h2 style="font-size:17px;margin-bottom:12px">Contact details</h2>
      <div class="contact-row"><span class="k">Name</span><span class="v" id="profName"></span></div>
      <div class="contact-row"><span class="k">Email</span><span class="v" id="profEmail"></span></div>
      <div class="contact-row"><span class="k">Phone</span><span class="v" id="profPhone"></span></div>
    </div>

    <div>
      <section class="block">
        <h2>Favourite homes</h2>
        <div class="fav-list" id="favList"></div>
      </section>

      <section class="block">
        <h2>Your requested viewings</h2>
        <div class="viewings-list" id="viewingsList"></div>
      </section>
    </div>
  </div>
</main>

<script>
  const SUPABASE_URL = 'https://eyyaemqygddtxbbmbqhl.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_A_aCzMwxAPY_UX7M5cOTRg_oZGKAUVG';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const loadingNote = document.getElementById('loadingNote');
  const contentGrid = document.getElementById('contentGrid');
  const favList = document.getElementById('favList');
  const viewingsList = document.getElementById('viewingsList');

  document.getElementById('signOutLink').addEventListener('click', async function () {
    await supabase.auth.signOut();
    window.location.href = 'tenant-login.html';
  });

  function statCard(num, label) {
    return '<div class="stat-card"><div class="num">' + num + '</div><div class="lbl">' + label + '</div></div>';
  }

  function houseIconSvg() {
    return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z" stroke="currentColor" stroke-width="1.5"/></svg>';
  }

  function renderRainbow(score) {
    if (score === null || score === undefined) {
      return '<div class="rainbow-row"><div class="rainbow-bar unknown"></div><span class="rainbow-lbl">not available</span></div>';
    }
    return '<div class="rainbow-row"><div class="rainbow-bar"><div class="rainbow-marker" style="left:' + score + '%"></div></div>' +
      '<span class="rainbow-lbl">' + score + '% affordability match</span></div>';
  }

  async function removeFavourite(tenantId, propertyId, cardEl) {
    await supabase.from('favourites').delete().eq('tenant_id', tenantId).eq('property_id', propertyId);
    cardEl.remove();
  }

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = 'tenant-login.html';
      return;
    }

    const { data: profile } = await supabase
      .from('tenants')
      .select('name, email, phone')
      .eq('id', session.user.id)
      .maybeSingle();

    document.getElementById('tenantNameLabel').textContent = profile ? profile.name : session.user.email;
    document.getElementById('profName').textContent = profile ? profile.name : '—';
    document.getElementById('profEmail').textContent = profile ? profile.email : session.user.email;
    document.getElementById('profPhone').textContent = profile ? profile.phone : '—';

    const [favouritesRes, viewingsRes] = await Promise.all([
      supabase.from('favourites').select('property_id, properties(address, rent_pcm)').eq('tenant_id', session.user.id),
      supabase.from('viewings').select('requested_at, affordability_score, properties(address)').eq('tenant_id', session.user.id).order('requested_at', { ascending: false })
    ]);

    loadingNote.remove();
    contentGrid.style.display = 'grid';
    document.getElementById('statsGrid').style.display = 'grid';

    const favourites = favouritesRes.data || [];
    const viewings = viewingsRes.data || [];

    document.getElementById('statsGrid').innerHTML =
      statCard(favourites.length, 'Favourites saved') +
      statCard(viewings.length, 'Viewings requested');

    // ---- Favourites ----
    if (favouritesRes.error) {
      favList.innerHTML = '<div class="empty-card">Could not load favourites: ' + favouritesRes.error.message + '</div>';
    } else if (favourites.length === 0) {
      favList.innerHTML = '<div class="empty-card">No favourite homes saved yet. ' +
        'Once the main site\'s "save to favourites" button is wired up, they\'ll appear here automatically.</div>';
    } else {
      favourites.forEach(f => {
        const row = document.createElement('div');
        row.className = 'fav-card';
        const rent = f.properties && f.properties.rent_pcm ? '£' + f.properties.rent_pcm + ' pcm' : '';
        row.innerHTML =
          '<div class="fav-icon">' + houseIconSvg() + '</div>' +
          '<div class="fav-main"><div class="addr">' + (f.properties ? f.properties.address : 'Unknown address') + '</div>' +
          '<div class="rent">' + rent + '</div></div>' +
          '<button type="button">Remove</button>';
        row.querySelector('button').addEventListener('click', function () {
          removeFavourite(session.user.id, f.property_id, row);
        });
        favList.appendChild(row);
      });
    }

    // ---- Your requested viewings ----
    if (viewingsRes.error) {
      viewingsList.innerHTML = '<div class="empty-card">Could not load viewings: ' + viewingsRes.error.message + '</div>';
    } else if (viewings.length === 0) {
      viewingsList.innerHTML = '<div class="empty-card">No viewings requested yet.</div>';
    } else {
      viewingsList.innerHTML = viewings.map(v => {
        const when = new Date(v.requested_at).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' });
        return '<div class="viewing-card">' +
          '<div class="addr">' + (v.properties ? v.properties.address : 'Unknown address') + '</div>' +
          '<div class="when">' + when + '</div>' +
          renderRainbow(v.affordability_score) +
          '</div>';
      }).join('');
    }
  }

  init();
</script>
</body>
</html>
