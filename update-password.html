<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Reset password | 00.house</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f5f2ee;
      --panel: #ffffff;
      --line: #e8e0d8;
      --ink: #1d262c;
      --muted: #5d6974;
      --navy: #0f3d5c;
      --navy-soft: #e6f0f7;
      --green: #2f6b57;
      --green-soft: #ebf7f0;
      --danger: #b63b41;
      --danger-soft: #fdecef;
      --shadow: 0 20px 44px rgba(24, 30, 35, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f7f2ee, #eef4f7);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--ink);
    }

    .card {
      width: min(440px, calc(100vw - 24px));
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 28px 24px 22px;
    }

    .badge {
      display: inline-block;
      background: var(--navy-soft);
      color: var(--navy);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 8px;
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-weight: 700;
      font-size: clamp(32px, 4vw, 40px);
      line-height: 1.1;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--ink);
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 13px;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }

    input:focus {
      outline: none;
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(15, 61, 92, 0.08);
    }

    .primary {
      margin-top: 8px;
      width: 100%;
      border: 0;
      cursor: pointer;
      border-radius: 10px;
      padding: 12px 14px;
      font: 600 14px 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--navy), #1d5379);
      color: #fff;
      box-shadow: 0 12px 22px rgba(15, 61, 92, 0.18);
    }

    .primary:disabled {
      opacity: 0.7;
      cursor: default;
    }

    .help {
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .link-button {
      background: none;
      border: none;
      color: var(--navy);
      padding: 0;
      font: 600 12px 'Inter', sans-serif;
      cursor: pointer;
      text-decoration: none;
    }

    .message {
      display: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12.5px;
      margin-top: 8px;
    }

    .message.error {
      display: block;
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid #f2c7cd;
    }

    .message.ok {
      display: block;
      background: var(--green-soft);
      color: var(--green);
      border: 1px solid #cfe7dc;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Password reset</div>
    <h1>Choose a new password</h1>
    <p>Use the secure reset link sent to your email. If the link has expired, request a new one from the admin login page.</p>

    <div id="message" class="message"></div>

    <form id="resetForm" novalidate>
      <div>
        <label for="newPassword">New password</label>
        <input id="newPassword" type="password" required autocomplete="new-password" placeholder="Enter a new password" />
      </div>

      <div>
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password" required autocomplete="new-password" placeholder="Repeat the new password" />
      </div>

      <button class="primary" type="submit" id="submitBtn">Update password</button>
    </form>

    <div class="help">
      <button type="button" class="link-button" id="backToLogin">Back to admin login</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://eyyaemqygddtxbbmbqhl.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_A_aCzMwxAPY_UX7M5cOTRg_oZGKAUVG';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('resetForm');
    const submitBtn = document.getElementById('submitBtn');
    const messageEl = document.getElementById('message');
    const backBtn = document.getElementById('backToLogin');

    function showMessage(text, kind) {
      messageEl.textContent = text;
      if (!text) {
        messageEl.className = 'message';
        return;
      }
      messageEl.className = 'message ' + kind;
    }

    async function initialiseResetPage() {
      const { data, error } = await supabase.auth.getSession();
      if (error) {
        showMessage('Unable to validate the reset link. It may have expired or been used already.', 'error');
        form.style.display = 'none';
        return;
      }

      if (!data.session) {
        showMessage('This password reset link may have expired or already been used. Please request a new reset email from the admin login page.', 'error');
        form.style.display = 'none';
        return;
      }

      showMessage('Your reset link is valid. Enter a new password below.', 'ok');
    }

    backBtn.addEventListener('click', () => {
      window.location.href = 'admin-login.html';
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submitBtn.disabled = true;
      showMessage('', '');

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!newPassword || !confirmPassword) {
        showMessage('Please enter both password fields.', 'error');
        submitBtn.disabled = false;
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage('Passwords do not match.', 'error');
        submitBtn.disabled = false;
        return;
      }

      try {
        const { error } = await supabase.auth.updateUser({ password: newPassword });

        if (error) {
          showMessage(error.message, 'error');
          return;
        }

        showMessage('Password updated successfully. You can now sign in with your new password.', 'ok');
        form.reset();
        form.style.display = 'none';
      } catch (error) {
        showMessage(error.message || 'Unable to update your password.', 'error');
      } finally {
        submitBtn.disabled = false;
      }
    });

    initialiseResetPage();
  </script>
</body>
</html>
