<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>00.house — Are you looking for a house?</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

<style>
/* Base & layout (kept and condensed) */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--black:#0a0a0a;--white:#fff;--muted:#6b6b6b;--rose:#c57b83;--panel-w:520px}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;color:var(--black);background:var(--white);overflow-x:hidden}
.sr-only{position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden}

/* Navigation */
nav{position:fixed;top:0;left:0;right:0;z-index:120;display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:70px;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border-bottom:1.5px solid rgba(0,0,0,0.08)}
.nav-logo{display:flex;align-items:center;gap:12px;font-weight:400;font-size:18px}
.nav-actions{display:flex;gap:8px;align-items:center}
.toggle-theme{border:1px solid rgba(0,0,0,0.08);background:transparent;padding:6px 10px;border-radius:999px;cursor:pointer}

/* Hero */
.hero{position:relative;height:92vh;min-height:520px;display:flex;align-items:center;justify-content:center;padding-top:40px}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:1}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.15),rgba(255,255,255,0.45));z-index:2;pointer-events:none}
.hero-search-wrapper{position:relative;z-index:10;background:rgba(255,255,255,0.96);padding:28px;border-radius:18px;border:1px solid rgba(0,0,0,0.06);width:92%;max-width:820px;text-align:center;box-shadow:0 20px 40px rgba(10,10,10,0.08)}
.tagline{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,3.6vw,42px);margin-bottom:12px}

/* Search form */
.search-form{display:flex;flex-direction:column;gap:10px}
.search-pill{display:flex;align-items:center;gap:10px;border-radius:999px;padding:8px 12px;border:1.5px solid var(--black);background:var(--white)}
.search-pill select,input{border:0;background:transparent;font-size:14px}
.search-pill input{flex:1;min-width:140px;padding-left:6px}
.search-pill button{background:var(--black);color:#fff;border:0;padding:8px 12px;border-radius:999px;cursor:pointer}

/* Floral map wrapper */
.floral-map-wrapper{margin:60px auto 40px;max-width:980px;position:relative;border-radius:20px;padding:18px;background-color:#e9efe2;box-shadow:0 20px 40px rgba(10,10,10,0.06)}
.floral-map-wrapper::before{content:'';position:absolute;inset:0;border-radius:20px;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,0.6),rgba(255,255,255,0.4))}
.floral-frame{position:absolute;inset:-16px;width:calc(100% + 32px);height:calc(100% + 32px);left:-16px;top:-16px;pointer-events:none;z-index:6}
.map-badge{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--white);padding:8px 20px;border-radius:100px;border:1.5px solid rgba(0,0,0,0.06);z-index:8}
.map-box{border-radius:12px;border:1.5px solid rgba(0,0,0,0.06);overflow:hidden;z-index:7}
#map{width:100%;height:420px}

/* Tenant card flourishes */
.tenant-card-rose{position:relative;overflow:hidden;border-radius:14px;padding:28px;color:#fff;background:var(--rose);box-shadow:0 12px 30px rgba(197,123,131,0.25)}
.tenant-card-rose::before,.tenant-card-rose::after{content:'';position:absolute;pointer-events:none;z-index:1;background-repeat:no-repeat;background-size:contain}
.tenant-card-rose::before{left:-6%;top:-10%;width:44%;height:56%;background-image:url('/assets/rose-modern.svg');opacity:0.08;transform:rotate(-8deg)}
.tenant-card-rose::after{right:-6%;bottom:-8%;width:42%;height:62%;background-image:url('/assets/rose-classic.svg');opacity:0.06;transform:rotate(12deg)}
.tenant-card-rose .tc-content{position:relative;z-index:2}

/* Theme variants: modern (default) and classic */
body.theme-modern .floral-frame{opacity:0.95;filter:none}
body.theme-modern .floral-frame rect{stroke:rgba(26,26,26,0.06)}
body.theme-modern .tenant-card-rose{background:linear-gradient(135deg,var(--rose),#b8596b)}

body.theme-classic .floral-frame{filter:drop-shadow(0 8px 18px rgba(0,0,0,0.12));opacity:0.98}
body.theme-classic .floral-frame rect{stroke:rgba(26,26,26,0.12)}
body.theme-classic .tenant-card-rose{background:linear-gradient(180deg,#b54b5d,#8b2f3f);box-shadow:0 18px 48px rgba(0,0,0,0.18)}
body.theme-classic .tenant-card-rose::before{background-image:url('/assets/rose-classic.svg');opacity:0.10}
body.theme-classic .tenant-card-rose::after{background-image:url('/assets/rose-modern.svg');opacity:0.08}

/* Responsive */
@media(max-width:760px){nav{padding:0 14px}.hero{height:72vh}.hero-search-wrapper{padding:18px}.floral-map-wrapper{margin:36px 12px}.tenant-card-rose{padding:20px}}
</style>
</head>
<body class="theme-modern">

<nav>
  <div class="nav-logo"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z" fill="none" stroke="#000" stroke-width="1.2"/></svg>00.house</div>
  <div class="nav-actions">
    <button class="pill" onclick="openPanel()">EXPLORE</button>
    <button class="pill" onclick="openPanel()">ACCOUNT</button>
    <button id="themeToggle" class="toggle-theme" aria-pressed="false" title="Toggle style">Modern</button>
  </div>
</nav>

<section class="hero" aria-label="Hero: aspirational home photo">
  <img src="home-house-rent.jpeg" class="hero-img" alt="" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=2000&q=80'">
  <div class="hero-search-wrapper" role="region" aria-labelledby="site-title">
    <h1 id="site-title" class="tagline">00.house — <em>Are you looking for a house?</em></h1>
    <form id="searchForm" class="search-form" role="search" aria-label="Find a city to center the map">
      <div class="search-pill">
        <label for="country" class="sr-only">Country</label>
        <select id="country" name="country" aria-label="Country">
          <option value="">Choose country</option>
          <option value="england">England</option>
          <option value="scotland">Scotland</option>
          <option value="wales">Wales</option>
          <option value="northern_ireland">Northern Ireland</option>
          <option value="ireland">Ireland</option>
          <option value="france">France</option>
          <option value="germany">Germany</option>
          <option value="poland">Poland</option>
          <option value="italy">Italy</option>
          <option value="spain">Spain</option>
          <option value="greece">Greece</option>
          <option value="lebanon">Lebanon</option>
          <option value="syria">Syria</option>
          <option value="uae">United Arab Emirates</option>
          <option value="qatar">Qatar</option>
          <option value="kuwait">Kuwait</option>
          <option value="bahrain">Bahrain</option>
          <option value="saudi">Saudi Arabia</option>
          <option value="egypt">Egypt</option>
          <option value="usa">United States</option>
          <option value="canada">Canada</option>
          <option value="mexico">Mexico</option>
          <option value="other">Other</option>
        </select>
        <label for="city" class="sr-only">City</label>
        <input id="city" name="city" list="city-list" placeholder="Choose a city or type one..." autocomplete="off" aria-label="City" />
        <datalist id="city-list"></datalist>
        <button type="submit" aria-label="Search and go to map">Search</button>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--muted);">
        <div>Popular luxury locations highlighted</div>
        <div><button type="button" style="border:0;background:transparent;cursor:pointer;color:var(--muted);" onclick="scrollToMap()">Go to Map ↓</button></div>
      </div>
    </form>
  </div>
</section>

<div class="floral-map-wrapper" id="map-target">
  <svg class="floral-frame" viewBox="0 0 1200 700" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="rose-symbol" viewBox="0 0 100 100"><path d="M50 15C60 10 72 12 80 22c8 10 8 22 1 32-7 10-20 18-30 18s-22-8-30-18C7 34 7 22 15 12 23 2 40 0 50 15z" fill="none" stroke="rgba(20,20,20,0.08)" stroke-width="3"/><circle cx="50" cy="42" r="6" fill="rgba(20,20,20,0.06)"/></symbol>
      <pattern id="rosePattern" patternUnits="userSpaceOnUse" width="120" height="120"><use href="#rose-symbol" x="0" y="0" width="100" height="100"></use></pattern>
      <filter id="frameEmboss" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.06"/></filter>
    </defs>
    <rect x="12" y="12" width="1176" height="676" rx="28" fill="none" stroke="rgba(26,26,26,0.06)" stroke-width="1.5" filter="url(#frameEmboss)"/>
    <use href="#rose-symbol" x="20" y="20" width="70" height="70" fill="rgba(197,123,131,0.06)"/>
    <use href="#rose-symbol" x="1100" y="20" width="70" height="70" transform="rotate(90 1135 55)" fill="rgba(197,123,131,0.06)"/>
    <use href="#rose-symbol" x="20" y="620" width="70" height="70" transform="rotate(-90 55 655)" fill="rgba(197,123,131,0.06)"/>
    <use href="#rose-symbol" x="1100" y="620" width="70" height="70" transform="rotate(180 1135 655)" fill="rgba(197,123,131,0.06)"/>
    <rect x="36" y="36" width="1128" height="628" rx="18" fill="transparent" stroke="url(#rosePattern)" stroke-width="6" opacity="0.12"/>
  </svg>

  <div class="map-badge" id="mapBadge">73 properties</div>
  <div class="map-box">
    <div id="map" role="region" aria-label="Map of properties"></div>
  </div>
</div>

<!-- services / tenant etc (kept simple) -->
<div style="max-width:980px;margin:0 auto;padding:20px 24px">
  <div class="tenant-pass-container">
    <div class="tenant-card-rose">
      <div class="tc-content">
        <h2 class="tc-title">Tenant Application Card</h2>
        <p class="tc-desc">Required to apply. Secure your properties with our tenant card. <a href="#" style="color:rgba(255,255,255,0.95);font-weight:600;">[Learn More]</a></p>
        <div class="tc-interactive" style="display:flex;gap:12px;align-items:center">
          <div style="width:44px;height:44px;border-radius:8px;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M9 12l2 2 4-4"/></svg></div>
          <div style="flex:1">
            <div style="height:8px;background:rgba(255,255,255,0.12);border-radius:8px;overflow:hidden"><div class="tc-bar-fill" style="width:45%;height:100%"></div></div>
            <div style="font-size:12px;margin-top:6px;text-transform:uppercase;letter-spacing:0.04em">Application progress</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<footer style="max-width:980px;margin:40px auto;padding:24px;color:var(--muted)">
  <div style="display:flex;justify-content:space-between;gap:24px">
    <div>
      <h4 style="font-size:13px;margin-bottom:8px">Company</h4>
      <div style="display:flex;flex-direction:column;gap:6px"><a href="#">About</a><a href="#">Careers</a><a href="#">Contact</a></div>
    </div>
    <div>
      <h4 style="font-size:13px;margin-bottom:8px">Legal</h4>
      <div style="display:flex;flex-direction:column;gap:6px"><a href="#">Terms</a><a href="#">Privacy</a></div>
    </div>
  </div>
</footer>

<!-- Side panel minimal (kept) -->
<div class="panel-overlay" id="overlay" onclick="closePanel()"></div>
<div class="side-panel" id="sidePanel" aria-hidden="true"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
// Theme toggle
const themeToggle = document.getElementById('themeToggle');
themeToggle.addEventListener('click', () => {
  const body = document.body;
  if (body.classList.contains('theme-modern')) {
    body.classList.remove('theme-modern');
    body.classList.add('theme-classic');
    themeToggle.textContent = 'Classical';
    themeToggle.setAttribute('aria-pressed','true');
  } else {
    body.classList.remove('theme-classic');
    body.classList.add('theme-modern');
    themeToggle.textContent = 'Modern';
    themeToggle.setAttribute('aria-pressed','false');
  }
});

function scrollToMap(){document.getElementById('map-target').scrollIntoView({behavior:'smooth',block:'center'})}
function openPanel(){document.getElementById('sidePanel').classList.add('open');document.getElementById('overlay').classList.add('open');document.body.style.overflow='hidden'}
function closePanel(){document.getElementById('sidePanel').classList.remove('open');document.getElementById('overlay').classList.remove('open');document.body.style.overflow=''}

// Map + search logic (simplified)
document.addEventListener('DOMContentLoaded', function(){
  const map = L.map('map',{zoomControl:true,scrollWheelZoom:false}).setView([51.5074,-0.1278],11);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
  let marker=null;
  function setMarker(latlng,title){ if(marker) map.removeLayer(marker); marker=L.marker(latlng).addTo(map); if(title) marker.bindPopup(title).openPopup(); }

  const cityCoordinates = {"London":[51.5074,-0.1278],"Windsor":[51.4839,-0.6044],"Edinburgh":[55.9533,-3.1883],"Dublin":[53.3498,-6.2603],"Paris":[48.8566,2.3522],"Nice":[43.7102,7.2620],"Milan":[45.4642,9.19],"Rome":[41.9028,12.4964],"Munich":[48.1351,11.582],"Dubai":[25.2048,55.2708],"Abu Dhabi":[24.4539,54.3773],"Doha":[25.2854,51.5310],"Riyadh":[24.7136,46.6753],"Cairo":[30.0444,31.2357],"Beirut":[33.8938,35.5018],"Los Angeles":[34.0522,-118.2437],"Palo Alto":[37.4419,-122.1430],"San Francisco":[37.7749,-122.4194],"New York":[40.7128,-74.0060],"Toronto":[43.6532,-79.3832]};

  const countryCities = {england:['London','Windsor','Bath','Bournemouth'],scotland:['Edinburgh','St Andrews','Aberdeen'],wales:['Cardiff','Swansea','Conwy'],northern_ireland:['Belfast'],ireland:['Dublin','Kinsale'],france:['Paris','Nice','Cannes'],germany:['Munich','Berlin','Hamburg'],poland:['Warsaw','Krakow'],italy:['Milan','Rome','Lake Como'],spain:['Barcelona','Madrid','Marbella'],greece:['Athens','Mykonos'],lebanon:['Beirut'],syria:['Damascus'],uae:['Dubai','Abu Dhabi'],qatar:['Doha'],kuwait:['Kuwait City'],bahrain:['Manama'],saudi:['Riyadh','Jeddah'],egypt:['Cairo','Alexandria'],usa:['New York','Los Angeles','San Francisco','Palo Alto','Miami'],canada:['Toronto','Vancouver'],mexico:['Mexico City','Cabo San Lucas'],other:['Dubai','London','New York','Paris']};

  const countrySelect=document.getElementById('country');const cityInput=document.getElementById('city');const cityList=document.getElementById('city-list');const searchForm=document.getElementById('searchForm');
  function updateCityList(){const code=countrySelect.value;const cities=(countryCities[code])?countryCities[code]:[];cityList.innerHTML=cities.map(c=>`<option value="${c}"></option>`).join('');cityInput.value='';}
  countrySelect.addEventListener('change',updateCityList);
  updateCityList();

  searchForm.addEventListener('submit',function(e){e.preventDefault();const city=cityInput.value.trim();if(!city){alert('Please select or enter a city.');return;} if(cityCoordinates[city]){map.flyTo(cityCoordinates[city],12);setMarker(cityCoordinates[city],city);document.getElementById('mapBadge').textContent='Properties around '+city;setTimeout(()=>map.invalidateSize(),300);document.getElementById('map-target').scrollIntoView({behavior:'smooth',block:'center'});return;} const countryText=countrySelect.options[countrySelect.selectedIndex]?.text||'';const q=encodeURIComponent(city+(countryText?(' '+countryText):''));fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&limit=1`).then(r=>r.json()).then(results=>{if(!results||results.length===0){alert('Location not found. Try a suggestion.');return;}const lat=parseFloat(results[0].lat),lon=parseFloat(results[0].lon);map.flyTo([lat,lon],12);setMarker([lat,lon],city);document.getElementById('mapBadge').textContent='Properties around '+city;setTimeout(()=>map.invalidateSize(),300);document.getElementById('map-target').scrollIntoView({behavior:'smooth',block:'center'});}).catch(err=>{console.error(err);alert('Geocoding failed.');}); });
});
</script>
</body>
</html>
