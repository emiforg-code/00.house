<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>00.house — Find your home</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

<style>
:root{--black:#0a0a0a;--muted:#6b6b6b;--white:#fff;--accent:#c57b83}
*{box-sizing:border-box}
body{font-family:Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif;margin:0;color:var(--black);background:var(--white)}
nav{position:fixed;left:0;right:0;top:0;height:72px;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(255,255,255,0.96);z-index:120;border-bottom:1px solid rgba(0,0,0,0.04)}
.nav-left{display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600}
.nav-right{display:flex;align-items:center;gap:10px}
.pill{border:1px solid rgba(0,0,0,0.08);padding:8px 12px;border-radius:999px;background:transparent;cursor:pointer}

/* Header search pill */
.header-search{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid rgba(0,0,0,0.08);background:var(--white);min-width:360px}
.header-search select,input{border:0;background:transparent;font-size:14px}
.header-search input{flex:1}
.header-search button{background:var(--black);color:#fff;border:0;padding:8px 10px;border-radius:999px;cursor:pointer}

main{padding-top:92px;max-width:1200px;margin:0 auto}
.map-section{margin:20px;padding:0 20px}
.map-wrapper{position:relative;border-radius:14px;overflow:hidden;border:1px solid rgba(0,0,0,0.06)}
#map{width:100%;height:620px;display:block}
.map-badge{position:absolute;left:16px;top:16px;background:#fff;padding:8px 12px;border-radius:999px;border:1px solid rgba(0,0,0,0.06);z-index:20;box-shadow:0 6px 18px rgba(0,0,0,0.06)}

/* Floating service cards */
.services{display:flex;gap:12px;flex-wrap:wrap;padding:18px 0}
.card{background:#fff;border:1px solid rgba(0,0,0,0.06);padding:12px 16px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,0.06);display:flex;align-items:center;gap:12px;min-width:180px}
.card button{border:0;background:var(--accent);color:#fff;padding:8px 10px;border-radius:8px;cursor:pointer}

/* Tenant card */
.tenant-card{margin:20px 0;background:linear-gradient(135deg,#c87b86,#b14b5c);color:#fff;padding:20px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,0.12)}

/* Side panel */
.panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,0);pointer-events:none;z-index:230;transition:all 0.3s}
.panel-overlay.open{background:rgba(0,0,0,0.35);pointer-events:all}
.side-panel{position:fixed;right:-440px;top:0;width:420px;height:100vh;background:#fff;z-index:240;box-shadow:-18px 0 40px rgba(0,0,0,0.08);transition:right 0.35s;padding:18px;overflow:auto}
.side-panel.open{right:0}
.sample-card{border:1px solid rgba(0,0,0,0.06);padding:12px;border-radius:10px;margin-bottom:12px}

footer{padding:40px 20px;color:var(--muted)}
@media(max-width:760px){.header-search{min-width:unset;width:100%}.map-wrapper #map{height:520px}}
</style>
</head>
<body>
<nav>
  <div class="nav-left">
    <div class="logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z" stroke="#111" stroke-width="1.2" fill="none"/></svg>00.house</div>
  </div>
  <div style="flex:1;display:flex;justify-content:center;padding:0 12px">
    <form id="headerSearch" class="header-search" role="search" aria-label="Search by city or country">
      <label class="sr-only" for="h-country">Country</label>
      <select id="h-country" aria-label="Country">
        <option value="">Country</option>
        <option value="usa">United States</option>
        <option value="uk">United Kingdom</option>
        <option value="france">France</option>
        <option value="germany">Germany</option>
        <option value="uae">United Arab Emirates</option>
        <option value="canada">Canada</option>
        <option value="other">Other</option>
      </select>
      <label class="sr-only" for="h-city">City</label>
      <input id="h-city" list="h-city-list" placeholder="Search by city or country" aria-label="City or town" />
      <datalist id="h-city-list"></datalist>
      <button type="submit" aria-label="Search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
    </form>
  </div>
  <div class="nav-right">
    <button class="pill" onclick="openPanel('explore')">Explore</button>
    <button class="pill" onclick="openPanel('account')">Account</button>
  </div>
</nav>

<main>
  <section class="map-section">
    <div class="map-wrapper">
      <div class="map-badge" id="mapBadge">73 properties</div>
      <div id="map"></div>
    </div>

    <div class="services">
      <div class="card"><div style="font-size:20px;">🏠</div><div><strong>Interior Design</strong><div style="font-size:13px;color:var(--muted)">Blow property management your property Management.</div></div><div style="margin-left:auto"><button onclick="openPanel('interior')">[1]</button></div></div>
      <div class="card"><div style="font-size:20px;">🧾</div><div><strong>Tenant Screening</strong></div><div style="margin-left:auto"><button onclick="openPanel('screening')">Open</button></div></div>
      <div class="card"><div style="font-size:20px;">🛡️</div><div><strong>Landlord Insurance</strong></div><div style="margin-left:auto"><button onclick="openPanel('insurance')">Open</button></div></div>
    </div>

    <div class="tenant-card">
      <h3>Tenant Application Card</h3>
      <p>Required to apply. Secure your properties with our tenant card. <a href="#" style="color:#fff;text-decoration:underline">Learn More</a></p>
    </div>
  </section>

  <footer>
    <div style="display:flex;gap:40px;flex-wrap:wrap">
      <div>
        <h4>Company</h4>
        <a href="#">About Us</a><br>
        <a href="#">Careers</a><br>
        <a href="#">Contact</a>
      </div>
      <div>
        <h4>Legal</h4>
        <a href="#">Terms</a><br>
        <a href="#">Privacy</a>
      </div>
    </div>
  </footer>
</main>

<div class="panel-overlay" id="overlay" onclick="closePanel()"></div>
<div class="side-panel" id="sidePanel" aria-hidden="true"><div class="panel-body" id="panelBody"></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
// UI helpers
function openPanel(mode){ document.getElementById('sidePanel').classList.add('open'); document.getElementById('overlay').classList.add('open'); document.getElementById('sidePanel').setAttribute('aria-hidden','false'); document.body.style.overflow='hidden'; renderPanel(mode); }
function closePanel(){ document.getElementById('sidePanel').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); document.getElementById('sidePanel').setAttribute('aria-hidden','true'); document.body.style.overflow=''; }

function renderPanel(mode){ const body = document.getElementById('panelBody'); if(mode==='account'){ body.innerHTML=`<h2>Account</h2><p><button onclick="alert('Login stub')">Login</button> <button onclick="alert('Register stub')">Register</button></p><p style='color:var(--muted)'>Auth stubs — connect your auth provider</p>`; return;} if(mode==='interior'){ body.innerHTML='<h2>Interior Design</h2><p>Design services details.</p>'; return;} if(mode==='screening'){ body.innerHTML='<h2>Tenant Screening</h2><p>Screening details.</p>'; return;} if(mode==='insurance'){ body.innerHTML='<h2>Landlord Insurance</h2><p>Insurance details.</p>'; return;} // default explore
 body.innerHTML = `<h2>Explore Properties</h2><p style="color:var(--muted)">Sample properties near you</p>` + sampleProperties.map(p=>`<div class='sample-card'><strong>${p.title}</strong><div style='font-size:13px;color:var(--muted)'>${p.price}</div><div style='margin-top:8px'><button onclick="focusProperty(${p.id})">View</button> <button onclick="contactStub(${p.id})">Contact</button></div></div>`).join(''); }

function contactStub(id){ alert('Contact request sent (stub) for property '+id); }

// Sample property dataset
const sampleProperties = [
  {id:1,title:'Luxury Villa — Windsor',price:'£6,500 / month',lat:51.4839,lng:-0.6044},
  {id:2,title:'Penthouse — London',price:'£8,200 / month',lat:51.5074,lng:-0.1278},
  {id:3,title:'Villa — Palo Alto',price:'$12,500 / month',lat:37.4419,lng:-122.1430}
];

function focusProperty(id){ const p = sampleProperties.find(x=>x.id===id); if(!p) return; map.flyTo([p.lat,p.lng],12); setMarker([p.lat,p.lng],p.title); }

// Map init and search
let map, currentMarker=null, tileLayerPrimary=null, tileLayerFallback=null;
function setMarker(latlng, title){ if(currentMarker) map.removeLayer(currentMarker); currentMarker = L.marker(latlng).addTo(map); if(title) currentMarker.bindPopup(title).openPopup(); }

function trySwitchToFallback(){ try{ if(tileLayerPrimary) map.removeLayer(tileLayerPrimary); tileLayerFallback = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap contributors'}).addTo(map); console.warn('Switched to fallback tile layer'); }catch(e){ console.error('Fallback tile layer failed',e); } }

document.addEventListener('DOMContentLoaded', ()=>{
  try{
    map = L.map('map',{zoomControl:true,scrollWheelZoom:false}).setView([51.5074,-0.1278],11);
    tileLayerPrimary = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
    tileLayerPrimary.on('tileerror', function(){ console.warn('Tile error detected — switching fallback.'); trySwitchToFallback(); });

    // add sample markers
    sampleProperties.forEach(p=>{ L.circleMarker([p.lat,p.lng],{radius:6,fill:true,fillColor:'#c57b83',color:'#8c3f46',weight:1,fillOpacity:0.9}).addTo(map).bindPopup(`<strong>${p.title}</strong><div style='font-size:13px;color:${'#555'}'>${p.price}</div>`); });

    // ensure map redraw
    map.whenReady(()=>setTimeout(()=>map.invalidateSize(),300));
    window.addEventListener('resize', ()=>setTimeout(()=>map.invalidateSize(),200));

    // search & geocode helpers
    const countryCities = { usa:['New York','Los Angeles','San Francisco','Palo Alto','Miami'], uk:['London','Windsor','Bath'], france:['Paris','Nice'], germany:['Munich','Berlin'], uae:['Dubai','Abu Dhabi'], canada:['Toronto','Vancouver'], other:[] };
    const cityCoords = { 'London':[51.5074,-0.1278], 'Windsor':[51.4839,-0.6044], 'Palo Alto':[37.4419,-122.1430], 'San Francisco':[37.7749,-122.4194], 'New York':[40.7128,-74.0060], 'Los Angeles':[34.0522,-118.2437], 'Paris':[48.8566,2.3522], 'Munich':[48.1351,11.582] };

    const cSelect = document.getElementById('h-country'); const cInput = document.getElementById('h-city'); const cList = document.getElementById('h-city-list'); const form = document.getElementById('headerSearch');
    function populateCities(){ const code = cSelect.value || 'usa'; const list = countryCities[code] || []; cList.innerHTML = list.map(v=>`<option value="${v}"></option>`).join(''); }
    cSelect.addEventListener('change', populateCities); populateCities();

    form.addEventListener('submit', function(e){ e.preventDefault(); const city = cInput.value.trim(); if(!city){ alert('Please enter a city'); return; } if(city in cityCoords){ const coords = cityCoords[city]; map.flyTo(coords,12); setMarker(coords,city); document.getElementById('mapBadge').textContent = 'Properties around '+city; return; } // fallback geocode
      const countryText = cSelect.options[cSelect.selectedIndex]?.text || ''; const q = encodeURIComponent(city + (countryText ? (' '+countryText) : '')); fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&limit=1`).then(r=>r.json()).then(results=>{ if(!results || !results.length){ alert('Location not found. Try a suggestion.'); return; } const lat=parseFloat(results[0].lat), lon=parseFloat(results[0].lon); map.flyTo([lat,lon],12); setMarker([lat,lon],city); document.getElementById('mapBadge').textContent = 'Properties around '+city; }).catch(err=>{ console.error('Geocode failed',err); alert('Search failed'); });
    });

  }catch(err){ console.error('Map initialization error', err); }
});
</script>
</body>
</html>
