<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin sign in | 00.house</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{ --black:#0a0a0a; --muted:#6b6b6b; --white:#fff; --line:rgba(0,0,0,0.08); --brass:#b98a3f; }
*{box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;margin:0;background:#f3f1ec;color:var(--black);min-height:100vh;display:flex;flex-direction:column}
h1{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700;margin:0 0 6px;font-size:26px}
p{color:var(--muted);line-height:1.5}
nav{padding:16px 28px;background:var(--black);color:#fff;font-weight:600}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.card{background:#fff;border-radius:14px;padding:36px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.08);border:1px solid var(--line)}
.tag{display:inline-block;background:var(--black);color:#fff;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;margin-bottom:14px}
label{display:block;font-size:12.5px;font-weight:600;margin:16px 0 6px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px}
input:focus{outline:2px solid var(--brass)}
button.primary{width:100%;margin-top:22px;background:var(--black);color:#fff;border:0;padding:12px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer}
button.primary:hover{background:#222}
button.primary:disabled{opacity:0.6;cursor:default}
#message{display:none;margin-top:16px;padding:10px 12px;border-radius:8px;font-size:13px}
#message.error{display:block;background:#fdeceb;color:#a3312a}
.note{margin-top:22px;font-size:12px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<nav>00.house · Admin</nav>
<main>
  <div class="card">
    <span class="tag">Internal use only</span>
    <h1>Admin sign in</h1>
    <p>Admin accounts are created directly in Supabase — there's no public sign-up here.</p>
    <div id="message"></div>
    <form id="authForm">
      <label for="email">Email</label>
      <input id="email" type="email" required />
      <label for="password">Password</label>
      <input id="password" type="password" required />
      <button class="primary" type="submit" id="submitBtn">Sign in</button>
    </form>
    <p class="note">Remember to put this page behind Cloudflare Access before launch, on its own subdomain — this login is a second layer, not a replacement for that.</p>
  </div>
</main>
<script>
  const SUPABASE_URL = 'https://eyyaemqygddtxbbmbqhl.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_A_aCzMwxAPY_UX7M5cOTRg_oZGKAUVG';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const messageEl = document.getElementById('message');
  const submitBtn = document.getElementById('submitBtn');
  function showError(text) { messageEl.textContent = text; messageEl.className = 'error'; }

  if (new URLSearchParams(window.location.search).get('denied')) {
    showError('That account is not authorised as an admin.');
  }

  document.getElementById('authForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    submitBtn.disabled = true;
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) { showError(error.message); submitBtn.disabled = false; return; }

    const { data: adminRow } = await supabase.from('admins').select('id').eq('id', data.user.id).maybeSingle();
    if (!adminRow) {
      await supabase.auth.signOut();
      showError('That account is not authorised as an admin.');
      submitBtn.disabled = false;
      return;
    }
    window.location.href = 'admin.html';
  });
</script>
</body>
</html>
