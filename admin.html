<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin | 00.house</title>
<!--
  DO NOT link this page from your public navigation.
  Before go-live, put this page's URL (ideally on its own subdomain,
  e.g. admin.00.house) behind Cloudflare Access so only your own email
  can ever load it. The sign-in check below is a second layer, not a
  replacement for that.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{ --black:#0a0a0a; --muted:#6b6b6b; --white:#fff; --line:rgba(0,0,0,0.08); --brass:#b98a3f; --cream:#f6f2ea; }
*{box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;margin:0;background:#faf9f6;color:var(--black)}
h1{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700;margin:0}
p{color:var(--muted);line-height:1.5;margin:4px 0 0}
nav{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:var(--black);color:#fff}
.logo{font-weight:600;color:#fff}
.nav-right a{color:#fff;font-size:13px;text-decoration:none;margin-left:18px;opacity:0.9;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:36px 20px 80px}
.loading-note{background:var(--cream);border:1px solid var(--line);color:#6b5a3a;padding:10px 14px;border-radius:8px;font-size:12.5px;margin:18px 0 28px}
.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:22px}
.tab-btn{background:none;border:0;padding:10px 4px;font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-right:18px}
.tab-btn.active{color:var(--black);border-bottom-color:var(--brass)}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
th{text-align:left;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);padding:12px 16px;background:#fafafa;border-bottom:1px solid var(--line)}
td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top}
tr:last-child td{border-bottom:0}
.addr-list{display:flex;flex-direction:column;gap:6px}
.addr-pill{font-size:12px;background:#f2f2f2;border-radius:6px;padding:4px 8px;display:inline-block}
a.site-link{color:#0F3D5C}
.rainbow-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rainbow-bar{position:relative;flex:1;height:8px;border-radius:999px;background:linear-gradient(90deg,#d9453d 0%,#e0a62e 35%,#4caf6b 65%,#2f6b4f 100%);min-width:90px}
.rainbow-bar.unknown{background:#e2e2e2}
.rainbow-marker{position:absolute;top:-3px;width:3px;height:14px;background:#111;border-radius:2px;transform:translateX(-50%)}
.rainbow-addr{font-size:11.5px;color:var(--muted);white-space:nowrap}
#tenants-panel, #agents-panel{display:none}
#agents-panel.active, #tenants-panel.active{display:block}
.empty-card{background:#fff;border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--muted);font-size:13.5px}
</style>
</head>
<body>
<nav>
  <span class="logo">00.house · Admin</span>
  <div class="nav-right">
    <span id="adminLabel" style="opacity:0.8"></span>
    <a id="signOutLink">Sign out</a>
  </div>
</nav>

<main>
  <h1>Admin panel</h1>
  <p>Agents, tenants, and the viewings and affordability data behind each enquiry.</p>

  <div class="loading-note" id="loadingNote">Checking your access…</div>

  <div id="panels" style="display:none">
    <div class="tabs">
      <button class="tab-btn active" id="btn-agents" onclick="showTab('agents')">Agents</button>
      <button class="tab-btn" id="btn-tenants" onclick="showTab('tenants')">Tenants</button>
    </div>

    <div id="agents-panel" class="active">
      <table>
        <thead><tr><th>Name</th><th>Contact</th><th>Website</th></tr></thead>
        <tbody id="agentsBody"></tbody>
      </table>
    </div>

    <div id="tenants-panel">
      <table>
        <thead><tr><th>Name</th><th>Email / phone</th><th>IP location</th><th>Requested viewings</th><th>Affordability</th></tr></thead>
        <tbody id="tenantsBody"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
  const SUPABASE_URL = 'https://eyyaemqygddtxbbmbqhl.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_A_aCzMwxAPY_UX7M5cOTRg_oZGKAUVG';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function showTab(tab) {
    document.getElementById('agents-panel').classList.toggle('active', tab === 'agents');
    document.getElementById('tenants-panel').classList.toggle('active', tab === 'tenants');
    document.getElementById('btn-agents').classList.toggle('active', tab === 'agents');
    document.getElementById('btn-tenants').classList.toggle('active', tab === 'tenants');
  }

  document.getElementById('signOutLink').addEventListener('click', async function () {
    await supabase.auth.signOut();
    window.location.href = 'admin-login.html';
  });

  function renderRainbow(score) {
    if (score === null || score === undefined) {
      return '<div class="rainbow-row"><div class="rainbow-bar unknown"></div><span class="rainbow-addr">not available</span></div>';
    }
    return '<div class="rainbow-row"><div class="rainbow-bar"><div class="rainbow-marker" style="left:' + score + '%"></div></div>' +
      '<span class="rainbow-addr">' + score + '%</span></div>';
  }

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = 'admin-login.html'; return; }

    const { data: adminRow } = await supabase.from('admins').select('email').eq('id', session.user.id).maybeSingle();
    if (!adminRow) {
      await supabase.auth.signOut();
      window.location.href = 'admin-login.html?denied=1';
      return;
    }

    document.getElementById('adminLabel').textContent = adminRow.email;

    const [{ data: agents, error: agentsError }, { data: tenants, error: tenantsError }] = await Promise.all([
      supabase.from('agents').select('name, email, phone, agency_name, website_url'),
      supabase.from('tenants').select('name, email, phone, ip_location, viewings(affordability_score, properties(address))')
    ]);

    document.getElementById('loadingNote').remove();
    document.getElementById('panels').style.display = 'block';

    const agentsBody = document.getElementById('agentsBody');
    if (agentsError) {
      agentsBody.innerHTML = '<tr><td colspan="3">Could not load agents: ' + agentsError.message + '</td></tr>';
    } else if (!agents || agents.length === 0) {
      agentsBody.innerHTML = '<tr><td colspan="3">No agents registered yet.</td></tr>';
    } else {
      agentsBody.innerHTML = agents.map(a => {
        const site = a.website_url || '';
        const siteCell = site ? '<a class="site-link" href="' + site + '" target="_blank" rel="noopener">' + site.replace(/^https?:\/\//, '') + '</a>' : '—';
        return '<tr><td>' + a.name + (a.agency_name ? ' · ' + a.agency_name : '') + '</td>' +
          '<td>' + a.email + '<br><span style="color:#6b6b6b">' + (a.phone || '—') + '</span></td>' +
          '<td>' + siteCell + '</td></tr>';
      }).join('');
    }

    const tenantsBody = document.getElementById('tenantsBody');
    if (tenantsError) {
      tenantsBody.innerHTML = '<tr><td colspan="5">Could not load tenants: ' + tenantsError.message + '</td></tr>';
    } else if (!tenants || tenants.length === 0) {
      tenantsBody.innerHTML = '<tr><td colspan="5">No tenants registered yet.</td></tr>';
    } else {
      tenantsBody.innerHTML = tenants.map(t => {
        const viewings = t.viewings || [];
        const addrCell = viewings.length === 0
          ? '<span style="color:#9a9a9a">No viewings requested</span>'
          : '<div class="addr-list">' + viewings.map(v => '<span class="addr-pill">' + (v.properties ? v.properties.address : 'Unknown address') + '</span>').join('') + '</div>';
        const rainbowCell = viewings.length === 0 ? '—' : viewings.map(v => renderRainbow(v.affordability_score)).join('');
        return '<tr><td>' + t.name + '</td>' +
          '<td>' + t.email + '<br><span style="color:#6b6b6b">' + (t.phone || '—') + '</span></td>' +
          '<td>' + (t.ip_location || '—') + '</td>' +
          '<td>' + addrCell + '</td>' +
          '<td>' + rainbowCell + '</td></tr>';
      }).join('');
    }
  }

  init();
</script>
</body>
</html>
