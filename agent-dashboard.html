<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Agent dashboard | 00.house</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --black:#0a0a0a; --muted:#6b6b6b; --white:#fff; --line:rgba(0,0,0,0.08);
  --racing:#1f4632; --racing-green-tint:#E1EFE6; --brass:#b98a3f;
}
*{box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;margin:0;background:#ffffff;color:var(--black)}
h1,h2{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700;margin:0}
p{color:var(--muted);line-height:1.5;margin:4px 0 0}
nav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 20px;background:var(--racing);color:#fff}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;color:#fff;text-decoration:none;font-size:15px}
.nav-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav-right a,.nav-right span{color:#fff;font-size:12.5px;text-decoration:none;margin-left:14px;opacity:0.9;cursor:pointer}
main{max-width:920px;margin:0 auto;padding:24px 16px 70px}
@media (max-width:480px){
  nav{padding:12px 14px}
  .logo{font-size:14px}
  main{padding:18px 14px 60px}
  summary{padding:14px 12px}
}
.loading-note{background:#f5f5f7;border:1px solid var(--line);color:#444;padding:10px 14px;border-radius:8px;font-size:12.5px;margin-bottom:24px}
.empty-card{background:#fff;border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--muted);font-size:13.5px}

/* ---- Stat cards ---- */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0 6px}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 14px;text-align:center}
.stat-card .num{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700;font-size:26px;color:var(--racing);line-height:1}
.stat-card .lbl{font-size:10.5px;letter-spacing:0.04em;text-transform:uppercase;color:var(--muted);margin-top:5px}
@media (max-width:480px){ .stat-card .num{font-size:22px} }

/* ---- Mini bar chart: viewings per property ---- */
.chart-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:18px 0 28px}
.chart-card h2{font-size:15px;margin-bottom:14px}
.chart-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px}
.chart-row:last-child{margin-bottom:0}
.chart-label{flex:0 0 46%;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#333}
.chart-track{flex:1;height:10px;background:var(--racing-green-tint);border-radius:999px;overflow:hidden}
.chart-fill{height:100%;background:var(--racing);border-radius:999px;transition:width .4s ease}
.chart-val{flex:0 0 22px;text-align:right;font-weight:600;color:var(--racing)}

.list{display:flex;flex-direction:column;gap:12px;margin-top:8px}
details{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;font-weight:600}
summary::-webkit-details-marker{display:none}
summary .addr{display:flex;flex-direction:column;gap:3px}
summary .addr span.sub{font-size:12.5px;font-weight:400;color:var(--muted)}
summary .count{font-size:12px;font-weight:600;background:var(--racing-green-tint);color:var(--racing);padding:3px 10px;border-radius:999px}
summary .chev{transition:transform .2s;color:var(--muted)}
details[open] summary .chev{transform:rotate(90deg)}
.viewings{border-top:1px solid var(--line);padding:4px 18px 14px}
.viewing-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.viewing-row:last-child{border-bottom:0}
.viewing-row .who{font-weight:600}
.viewing-row .phone{color:var(--muted)}
.viewing-row .when{color:var(--brass);font-size:12.5px}
.empty{padding:14px 0;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<nav>
  <a class="logo" href="index.html">00.house <span style="opacity:.7;font-weight:400">· Agent</span></a>
  <div class="nav-right">
    <span id="agentNameLabel"></span>
    <a id="signOutLink">Sign out</a>
  </div>
</nav>

<main>
  <h1>Your listings</h1>
  <p>Expand an address to see viewings tenants have requested.</p>

  <div class="loading-note" id="loadingNote">Loading your account…</div>

  <div id="statsSection" style="display:none">
    <div class="stats-grid" id="statsGrid"></div>
    <div class="chart-card" id="chartCard" style="display:none">
      <h2>Viewings by property</h2>
      <div id="chartBody"></div>
    </div>
  </div>

  <div class="list" id="listingsList"></div>
</main>

<script>
  const SUPABASE_URL = 'https://eyyaemqygddtxbbmbqhl.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_A_aCzMwxAPY_UX7M5cOTRg_oZGKAUVG';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const loadingNote = document.getElementById('loadingNote');
  const list = document.getElementById('listingsList');

  document.getElementById('signOutLink').addEventListener('click', async function () {
    await supabase.auth.signOut();
    window.location.href = 'agent-login.html';
  });

  function statCard(num, label) {
    return '<div class="stat-card"><div class="num">' + num + '</div><div class="lbl">' + label + '</div></div>';
  }

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = 'agent-login.html';
      return;
    }

    const { data: profile } = await supabase
      .from('agents')
      .select('name, agency_name')
      .eq('id', session.user.id)
      .maybeSingle();

    document.getElementById('agentNameLabel').textContent =
      profile ? (profile.name + (profile.agency_name ? ' · ' + profile.agency_name : '')) : session.user.email;

    const { data: properties, error } = await supabase
      .from('properties')
      .select('id, address, created_at, viewings(tenant_name, tenant_phone, requested_at)')
      .eq('agent_id', session.user.id)
      .order('created_at', { ascending: false });

    loadingNote.remove();

    if (error) {
      list.innerHTML = '<div class="empty-card">Could not load your listings: ' + error.message + '</div>';
      return;
    }

    if (!properties || properties.length === 0) {
      list.innerHTML = '<div class="empty-card">No properties linked to your account yet. ' +
        'An "add listing" page is coming in a later step — for now, add a row to the ' +
        '<strong>properties</strong> table in Supabase\'s Table Editor with this account\'s ' +
        'agent_id to see it appear here.</div>';
      return;
    }

    // ---- Stats + mini chart ----
    const totalViewings = properties.reduce((sum, p) => sum + (p.viewings || []).length, 0);
    const weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
    const viewingsThisWeek = properties.reduce((sum, p) =>
      sum + (p.viewings || []).filter(v => new Date(v.requested_at).getTime() >= weekAgo).length, 0);

    document.getElementById('statsSection').style.display = 'block';
    document.getElementById('statsGrid').innerHTML =
      statCard(properties.length, 'Listings') +
      statCard(totalViewings, 'Viewings requested') +
      statCard(viewingsThisWeek, 'Requested this week');

    const withViewings = properties.filter(p => (p.viewings || []).length > 0);
    if (withViewings.length > 0) {
      const maxCount = Math.max(...withViewings.map(p => p.viewings.length));
      document.getElementById('chartCard').style.display = 'block';
      document.getElementById('chartBody').innerHTML = withViewings
        .slice().sort((a, b) => b.viewings.length - a.viewings.length)
        .map(p => {
          const n = p.viewings.length;
          const pct = Math.max(8, Math.round((n / maxCount) * 100));
          return '<div class="chart-row">' +
            '<span class="chart-label" title="' + p.address + '">' + p.address + '</span>' +
            '<div class="chart-track"><div class="chart-fill" style="width:' + pct + '%"></div></div>' +
            '<span class="chart-val">' + n + '</span>' +
            '</div>';
        }).join('');
    }

    // ---- Expandable listing cards ----
    properties.forEach(p => {
      const count = (p.viewings || []).length;
      const details = document.createElement('details');
      details.innerHTML =
        '<summary>' +
          '<div class="addr">' + p.address +
            '<span class="sub">' + count + ' viewing' + (count === 1 ? '' : 's') + ' requested</span>' +
          '</div>' +
          '<div style="display:flex;align-items:center;gap:10px">' +
            '<span class="count">' + count + '</span><span class="chev">&rsaquo;</span>' +
          '</div>' +
        '</summary>' +
        '<div class="viewings">' +
          (count === 0
            ? '<div class="empty">No viewings requested yet for this address.</div>'
            : p.viewings.map(v =>
                '<div class="viewing-row">' +
                  '<span class="who">' + v.tenant_name + '</span>' +
                  '<span class="phone">' + v.tenant_phone + '</span>' +
                  '<span class="when">' + new Date(v.requested_at).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' }) + '</span>' +
                '</div>').join('')
          ) +
        '</div>';
      list.appendChild(details);
    });
  }

  init();
</script>
</body>
</html>
